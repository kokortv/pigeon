<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Смена картинок по наклону</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        .image-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }
        #current-image {
            width: 100vw;
            height: 100vh;
            object-fit: cover;   /* теперь заполняет весь экран, обрезая лишнее */
            transition: opacity 0.2s ease;
            background: #222;
            user-select: none;
            -webkit-user-drag: none;
        }
        #info {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            width: fit-content;
            margin: 0 auto;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            pointer-events: none;
            z-index: 10;
            font-family: monospace;
        }
        #info span {
            font-weight: bold;
            color: #fff;
        }
        #calibration-notice {
            position: fixed;
            top: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: #ffaa00;
            font-size: 14px;
            background: rgba(0,0,0,0.7);
            padding: 6px 12px;
            width: fit-content;
            margin: 0 auto;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            z-index: 10;
            display: none;
        }
    </style>
</head>
<body>

<div class="image-container">
    <img id="current-image" src="img1.jpg" alt="Изображение">
</div>

<div id="info" style="display:none;">
    Угол: <span id="angle-display">0</span>° &nbsp;|&nbsp; Картинка: <span id="index-display">1</span>/6
</div>
<div id="calibration-notice">✅ Калибровка выполнена</div>

<script>
    (function() {
		// ----- НАСТРОЙКИ -----
		const IMAGES = [
			'img1.jpg',
			'img2.jpg',
			'img3.jpg',
			'img4.jpg',
			'img5.jpg',
			'img6.jpg'
		];
		// Диапазон наклона (в градусах) для переключения всех картинок
		const RANGE_DEG = 30; // от -30 до +30 относительно начального положения
		// -----------------------

		const imgElement = document.getElementById('current-image');
		const angleDisplay = document.getElementById('angle-display');
		const indexDisplay = document.getElementById('index-display');
		const calibrationNotice = document.getElementById('calibration-notice');

		let currentIndex = 0;
		let calibrationBeta = null; // будет хранить начальный угол

		// Функция обновления картинки
		function updateImage(index) {
			if (index < 0) index = 0;
			if (index >= IMAGES.length) index = IMAGES.length - 1;
			if (currentIndex !== index) {
				currentIndex = index;
				imgElement.src = IMAGES[index];
				indexDisplay.textContent = index + 1;
			}
		}

		// Функция обработки угла с учётом калибровки
		function handleOrientation(beta) {
			if (calibrationBeta === null) {
				// Запоминаем первый полученный угол как нулевой
				calibrationBeta = beta;
				calibrationNotice.style.display = 'block';
				setTimeout(() => { calibrationNotice.style.display = 'none'; }, 3000);
				console.log('Калибровка: начальный угол =', calibrationBeta);
				// Показываем первую картинку
				updateImage(0);
				angleDisplay.textContent = '0';
				return;
			}

			// Вычисляем отклонение от калиброванного нуля
			let delta = beta - calibrationBeta;
			// Ограничиваем диапазон, чтобы не выходить за пределы
			let clampedDelta = Math.min(RANGE_DEG, Math.max(-RANGE_DEG, delta));
			// Преобразуем в индекс: от -RANGE до +RANGE => 0..5
			let normalized = (clampedDelta + RANGE_DEG) / (2 * RANGE_DEG); // 0..1
			let index = Math.floor(normalized * IMAGES.length);
			if (index >= IMAGES.length) index = IMAGES.length - 1;
			updateImage(index);
			angleDisplay.textContent = Math.round(clampedDelta);
		}

		// ----- Обработка гироскопа -----
		function startListening() {
			window.addEventListener('deviceorientation', function(event) {
				let beta = event.beta;
				if (beta !== null && beta !== undefined) {
					handleOrientation(beta);
				}
			}, false);
		}

		// ----- Запрос разрешения для iOS 13+ -----
		if (typeof DeviceOrientationEvent !== 'undefined' &&
			typeof DeviceOrientationEvent.requestPermission === 'function') {
			DeviceOrientationEvent.requestPermission()
				.then(state => {
					if (state === 'granted') {
						startListening();
					} else {
						alert('Разрешение на доступ к гироскопу не получено. Картинки не будут меняться.');
					}
				})
				.catch(err => {
					console.warn('Ошибка запроса разрешения:', err);
					startListening();
				});
		} else {
			startListening();
		}

		// Показываем первую картинку сразу (до калибровки)
		updateImage(0);

		console.log('Страница загружена. Держите телефон ровно – через секунду произойдёт калибровка.');
	})();
</script>
</body>
</html>
